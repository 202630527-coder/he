<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 아침 메뉴 추천</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff9e6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        h1 {
            color: #ff9800;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #ff9800;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            margin: 5px;
        }
        .btn:hover {
            background-color: #e68a00;
        }
        .btn-sub {
            background-color: #4caf50;
        }
        .btn-sub:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🍳 풍성한 아침 메뉴 추천</h1>
        <p>오늘 아침은 뭘 먹을지 고민되시나요?<br>한식, 양식, 간단식까지 30가지 메뉴 중<br>오늘의 아침을 추천해 드릴게요!</p>
        <div>
            <a href="recommend.html" class="btn">랜덤 메뉴 추천 🎲</a>
        </div>
        <div style="margin-top: 15px;">
            <a href="menu-list.html" class="btn btn-sub">전체 메뉴 30가지 보기 📜</a>
        </div>
    </div>
</body>
</html>
