<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아침 메뉴 추천 결과</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff9e6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .category {
            display: inline-block;
            background-color: #ffe0b2;
            color: #e65100;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .menu-icon {
            font-size: 80px;
            margin: 10px 0;
        }
        .menu-name {
            font-size: 26px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
        }
        button {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #e68a00;
        }
        .back-link {
            display: block;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>오늘 아침 추천 메뉴!</h2>
        <div class="category" id="category">카테고리</div>
        <div class="menu-icon" id="icon">❓</div>
        <div class="menu-name" id="menu">버튼을 눌러주세요!</div>
        
        <button onclick="pickRandomMenu()">다른 메뉴 볼래요! 🔄</button>
        <a href="index.html" class="back-link">🏠 홈으로 돌아가기</a>
    </div>

    <script>
        // 다양한 아침 메뉴 30가지 목록
        const menus = [
            // 한식 / 국 / 죽
            { name: "콩나물국밥", icon: "🍲", category: "든든한 한식" },
            { name: "소고기 야채죽", icon: "🥣", category: "부드러운 한식" },
            { name: "따뜻한 누룽지 & 젓갈", icon: "🍚", category: "속 편한 한식" },
            { name: "계란말이 & 김치찌개", icon: "🥘", category: "든든한 한식" },
            { name: "황태해장국", icon: "🥣", category: "속 편한 한식" },
            { name: "미역국 & 쌀밥", icon: "🍲", category: "든든한 한식" },
            { name: "참치주먹밥", icon: "🍙", category: "간편 한식" },
            { name: "계란간장밥", icon: "🍳", category: "초간단 한식" },
            
            // 빵 / 샌드위치 / 양식
            { name: "프렌치 토스트", icon: "🍞", category: "달콤한 브런치" },
            { name: "햄치즈 샌드위치", icon: "🥪", category: "간편 양식" },
            { name: "에그 마요 샌드위치", icon: "🥪", category: "간편 양식" },
            { name: "베이글 & 크림치즈", icon: "🥯", category: "카페 스타일" },
            { name: "에그 베네딕트", icon: "🍳", category: "근사한 브런치" },
            { name: "크로와상 & 아메리카노", icon: "🥐", category: "카페 스타일" },
            { name: "팬케이크 & 메이플 시럽", icon: "🥞", category: "달콤한 브런치" },
            { name: "잉글리시 브랙퍼스트", icon: "🥓", category: "든든한 양식" },

            // 시리얼 / 요거트 / 건강식
            { name: "과일 듬뿍 그래놀라 요거트", icon: "🥣", category: "건강 간편식" },
            { name: "블루베리 오트밀", icon: "🌾", category: "건강 간편식" },
            { name: "우유 & 시리얼", icon: "🥣", category: "초간단식" },
            { name: "단호박 샐러드", icon: "🥗", category: "건강 간편식" },
            { name: "닭가슴살 샐러드", icon: "🥗", category: "다이어트식" },

            // 음료 / 과일 / 초간단식
            { name: "사과 & 듬뿍 듬뿍 땅콩버터", icon: "🍎", category: "초간단 과일식" },
            { name: "바나나 & 단백질 쉐이크", icon: "🍌", category: "바쁜 아침용" },
            { name: "ABC 주스 (사과·비트·당근)", icon: "🥤", category: "건강 음료" },
            { name: "삶은 계란 2개 & 두유", icon: "🥚", category: "단백질 충전" },
            { name: "아보카도 바나나 스무디", icon: "🥑", category: "건강 음료" },

            // 분식 및 기타
            { name: "따뜻한 어묵탕", icon: "🍢", category: "따뜻한 국물" },
            { name: "야채 떡만두국", icon: "🥟", category: "든든한 국물" },
            { name: "치즈 토스트", icon: "🍞", category: "초간단식" },
            { name: "고구마 & 우유", icon: "🍠", category: "속 편한 간식" }
        ];

        function pickRandomMenu() {
            const randomIndex = Math.floor(Math.random() * menus.length);
            const selectedMenu = menus[randomIndex];
            
            document.getElementById("category").textContent = selectedMenu.category;
            document.getElementById("icon").textContent = selectedMenu.icon;
            document.getElementById("menu").textContent = selectedMenu.name;
        }

        window.onload = pickRandomMenu;
    </script>
</body>
</html>
